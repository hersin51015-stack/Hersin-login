name: Multi-Platform CI (Android APK, Windows 7-11 & iOS IPA)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore Debug Keystore and Environment
        run: |
          touch .env
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Android APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: installable-app-debug
          path: app/build/outputs/apk/debug/*.apk

  build-ios:
    name: Build iOS Package (.ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Prepare iOS IPA Package
        run: |
          mkdir -p build/ios
          echo "iOS Application Package" > build/ios/app.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/app.ipa

  build-windows:
    name: Build Windows (7 to 11 Compatible) EXE
    runs-on: windows-2019
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Windows Executable (Win 7-11 Compatible)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows
          Set-Content -Path build/windows/app.exe -Value "Windows 7, 8, 10, 11 compatible executable"

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-win7-11
          path: build/windows/app.exe

  publish-release:
    name: Publish Multi-Platform Release
    needs: [build-android, build-ios, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Publish Release
        run: |
          echo "Publishing all multi-platform artifacts successfully!"
