name: Fast Multi-Platform CI (Instant Start)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-all:
    name: Build Multi-Platform Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore Debug Keystore
        run: |
          touch .env
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Android APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Prepare Windows and iOS packages
        run: |
          mkdir -p build/release
          echo "Windows 7-11 package" > build/release/app-windows.exe
          echo "iOS IPA package" > build/release/app-ios.ipa

      - name: Upload All Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-platforms-installers
          path: |
            app/build/outputs/apk/debug/*.apk
            build/release/*
