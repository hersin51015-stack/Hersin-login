name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build and Package iOS IPA
        run: |
          mkdir -p build/Payload/LoginApp.app
          
          # Compile Swift code for iOS Device (arm64)
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios15.0 \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -parse-as-library \
            -emit-executable \
            -o build/Payload/LoginApp.app/LoginApp \
            ios/LoginApp/LoginApp.swift \
            ios/LoginApp/ContentView.swift
          
          # Copy Info.plist into the app bundle
          cp ios/LoginApp/Info.plist build/Payload/LoginApp.app/Info.plist
          
          # Copy app icon if present
          if [ -f app/src/main/res/drawable/ic_horned_h_logo.png ]; then
            cp app/src/main/res/drawable/ic_horned_h_logo.png build/Payload/LoginApp.app/AppIcon60x60@2x.png
          fi
          
          # Create IPA archive from Payload folder
          cd build
          zip -qr ../app-debug.ipa Payload
          cd ..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoginApp-iOS-IPA
          path: app-debug.ipa
